name: App Android

on:
  push:
    branches: [main]
    paths: ["index.html", "icons/**", "nativo/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nativo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund
      - name: Copiar o app web
        run: node copia-web.js
      - name: Gerar o projeto Android
        run: npx cap add android && npx cap sync android
      - name: Compilar o APK de teste
        working-directory: nativo/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-cafe-android
          path: nativo/android/app/build/outputs/apk/debug/app-debug.apk

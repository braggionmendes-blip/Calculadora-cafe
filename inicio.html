<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calculadora de Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ed;--card:#fff;--soft:#f4f0eb;--fg:#1f1a17;--muted:#7a716a;--line:#dcd8d2;--accent:#7b3f1d;--accent-fg:#fff;--danger:#a3341f;--ok:#2f7a4a;--warn:#b26a00;--display:"Familjen Grotesk",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151311;--card:#1f1c19;--soft:#29251f;--fg:#f1ece6;--muted:#a69d94;--line:#3a352f;--accent:#d39060;--accent-fg:#1a120c;--danger:#e0735c}}
:root[data-theme="dark"]{--bg:#151311;--card:#1f1c19;--soft:#29251f;--fg:#f1ece6;--muted:#a69d94;--line:#3a352f;--accent:#d39060;--accent-fg:#1a120c;--danger:#e0735c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--display)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:1.1rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.ib svg{width:24px;height:24px}
.scr{padding:16px 16px 100px;display:grid;gap:12px;align-content:start}
[hidden]{display:none!important}
svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* início */
.home{flex:1;display:grid;grid-template-rows:auto 1fr auto;padding:14px 16px 28px;gap:14px}
.hb{display:flex;justify-content:space-between}
.hero{display:grid;place-items:center;align-content:center;gap:14px;text-align:center}
.hero svg.cup{width:120px;height:120px;color:var(--accent)}
.hero h1{margin:0;font-size:1.6rem;line-height:1.1}
.nome{display:inline-block;position:relative;font:400 1.5rem/1 "Permanent Marker",cursive;text-transform:uppercase;color:var(--accent-fg);padding:10px 22px;isolation:isolate;margin-top:4px}
.nome::before{content:"";position:absolute;inset:-2px -6px;z-index:-1;background:var(--accent);border-radius:8px 18px 10px 16px;transform:rotate(-1.5deg)}
.loc{font:400 .95rem "Permanent Marker",cursive;text-transform:uppercase;color:var(--accent)}
.go{border:0;border-radius:18px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:1.1rem;padding:16px;width:100%}
.locs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* listas */
.lbl{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:0;background:var(--card);border-radius:18px;padding:14px 6px;display:grid;justify-items:center;gap:6px;font-weight:600;font-size:.85rem}
.tile svg{width:34px;height:34px;color:var(--accent)}
.tile small{color:var(--muted);font-weight:500;font-size:.72rem}
.it{border:0;background:var(--card);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%}
.it svg{width:30px;height:30px;color:var(--accent)}
.it b{display:block;font-size:.95rem;line-height:1.2}
.it small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.it .chev{color:var(--muted);font-size:1.3rem}
.add{border:2px dashed var(--accent);background:transparent;color:var(--accent);border-radius:16px;padding:12px;font-weight:700;width:100%}
.hint{font-size:.84rem;color:var(--muted);margin:0}
.card{background:var(--card);border-radius:18px;padding:14px;display:grid;gap:10px}
.txt{width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px}
.txt:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pri{border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:13px 18px}
.sec{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:14px;font-weight:700;padding:11px 18px}
.del{border:0;background:transparent;color:var(--danger);font-weight:700;padding:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw input[type=checkbox]{width:44px;height:26px;appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;margin:0}
.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--accent)}.sw input:checked::after{left:21px}
.num{display:flex;align-items:center;gap:8px}.num button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700}.num span{min-width:24px;text-align:center;font-weight:700}
.rl{display:grid;gap:6px}.rl div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.rl button{border:0;background:var(--soft);border-radius:10px;width:40px;color:var(--danger);font-weight:700}
.tag{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}
/* folha de edição */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px 24px;display:grid;gap:12px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet h3{margin:0;font-size:1.15rem}
.acts{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ph{display:grid;place-items:center;gap:6px;text-align:center}
.av{width:84px;height:84px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--accent)}.av svg{width:48px;height:48px}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">

<!-- INÍCIO -->
<section id="sHome" class="home">
  <div class="hb">
    <button class="ib" data-nav="perfil" aria-label="Meu cadastro"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></button>
    <button class="ib" data-nav="config" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="hero">
    <svg class="cup" viewBox="0 0 64 64"><path d="M24 8c-2 3 2 5 0 8M32 6c-2 3 2 5 0 8M40 8c-2 3 2 5 0 8"/><path d="M12 24h36v12a14 14 0 0 1-14 14h-8a14 14 0 0 1-14-14z"/><path d="M48 28h4a6 6 0 0 1 0 12h-5"/><path d="M8 56h48"/></svg>
    <h1>Calculadora de Café</h1>
    <span class="nome" id="hNome"></span>
    <span class="lbl" style="margin-top:6px">Onde você está?</span>
    <div class="locs" id="hLocs"></div>
  </div>
  <button class="go" id="hGo">Bora fazer esse café</button>
</section>

<!-- TELAS INTERNAS -->
<section id="sIn" hidden>
  <div class="top"><button class="ib" id="voltar" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="tit"></h2><span></span></div>
  <div class="scr" id="corpo"></div>
</section>
</div>
<div class="toast" id="toast"></div>

<script>
const IC={

let D;try{D=JSON.parse(localStorage.getItem("calcIni")||"null")}catch(e){}
if(!D)D=JSON.parse(JSON.stringify(EXEMPLO));
const salva=()=>{try{localStorage.setItem("calcIni",JSON.stringify(D))}catch(e){}};

const $=id=>document.getElementById(id);
const toast=t=>{const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200)};
const locN=id=>(D.locais.find(l=>l.id===id)||{}).n||id;

// ===== início =====
function home(){$("hNome").textContent=D.perfil.nome||"Seu nome";
  $("hLocs").innerHTML=D.locais.map(l=>`<button class="chip" data-loc="${l.id}" aria-pressed="${locAtual===l.id}">${esc(locCurto(l))}</button>`).join("")}

// ===== telas internas =====
const TELAS={
 perfil:()=>["Meu cadastro",`<div class="ph"><div class="av">${S(IC.cafe)}</div></div>
   <div class="card"><label class="lbl" for="pNome">Nome</label><input class="txt" id="pNome" data-pf="nome" value="${esc(D.perfil.nome)}" autocomplete="name">
   <label class="lbl" for="pTel">Telefone</label><input class="txt" id="pTel" data-pf="tel" type="tel" inputmode="tel" value="${esc(D.perfil.tel)}" placeholder="(31) 9 0000-0000" autocomplete="tel">

  else if(k==="cafes"){const c=x||{n:"",torra:"",processo:"",data:"",ativo:true};tit=novo?(modo==="foto"?"Café pela foto":modo==="busca"?"Buscar café":"Novo café"):"Editar café";

     nome(c.n,"ex.: Sertãozin Laranja e Mel")+`<span class="lbl">Torra</span><div class="chips" data-un="torra">${["Clara","Média-clara","Média","Média-escura","Escura"].map(v=>`<button class="chip" data-v="${v}" aria-pressed="${c.torra===v}">${v}</button>`).join("")}</div>

  else if(k==="grupos"){tit=novo?"Novo tipo de preparo":"Editar tipo de preparo";h=nome(x||"","ex.: Cold brew")}
  const v=document.createElement("div");v.className="veil";v.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(tit)}"><div class="grab"></div><h3>${esc(tit)}</h3>${h}<div class="acts">${novo?"<span></span>":`<button class="del" id="fDel">Excluir</button>`}<div style="display:flex;gap:8px"><button class="sec" id="fCan">Cancelar</button><button class="pri" id="fOk">Salvar</button></div></div></div>`;
  document.body.appendChild(v);
  const fecha=()=>v.remove();
  v.addEventListener("click",e=>{const t=e.target;let b;
    if(t===v||t.closest("#fCan")){fecha();return}
    if(b=t.closest("[data-cl] [data-cv]")){const g=b.parentElement;if(g.dataset.cl==="u")g.querySelectorAll("[data-cv]").forEach(c=>c.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"||g.dataset.cl==="u"));return}
    if(b=t.closest("[data-un] [data-v]")){b.parentElement.querySelectorAll("[data-v]").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));return}
    if(b=t.closest("[data-pn]")){const s=$("fPot");s.textContent=Math.min(12,Math.max(0,+s.textContent+ +b.dataset.pn));return}
    if(t.closest("[data-rdel]")){t.closest("div").remove();return}

    if(t.closest("#fDel")){if(!t.closest("#fDel").dataset.arm){t.closest("#fDel").dataset.arm="1";t.closest("#fDel").textContent="Confirmar exclusão";return}
      const nm=k==="grupos"?D.grupos[i]:D[k][i].n;D[k].splice(i,1);if(k==="locais"){const id=x.id;for(const a of ["metodos","moedores","acessorios","peneiras"])D[a].forEach(z=>z.loc=z.loc.filter(y=>y!==id));D.balancas.forEach(z=>{if(z.loc===id)z.loc=(D.locais.find(l=>l.tipo==="fixo")||{}).id});if(locAtual===id)locAtual=""}
      if(k==="grupos")D.metodos.forEach(m=>{if(m.grupo===nm)m.grupo=D.grupos[0]||""});salva();fecha();mostra();toast(`"${nm}" excluído`);return}

// ===== leitura do rótulo e busca com o Claude =====
let SAMPLE=null;try{window.claude&&claude.use("sample").then(s=>{SAMPLE=s}).catch(()=>{})}catch(e){}
const FICHA=`Responda só com JSON neste formato: {"nome":"","torrefacao":"","torra":"","processo":"","variedade":"","origem":"","notas":"","data":"","pontos":null}.
- "nome": nome do café como está no rótulo (sem a palavra "café" no início, sem peso).
- "torra": uma destas exatamente: "Clara","Média-clara","Média","Média-escura","Escura", ou "" se não houver.
- "data": data da torra (ou de fabricação) no formato AAAA-MM-DD; "" se não houver. Nunca use a validade.
- "origem": cidade, região e altitude, se houver.
- "notas": notas sensoriais separadas por vírgula.
- Campo que não aparece: "". Não invente.`;
function preenche(v,d){if(!d||typeof d!=="object")return 0;let n=0;const set=(id,val)=>{const el=v.querySelector("#"+id);if(el&&val){el.value=val;n++}};
  set("fN",d.nome);set("fTorr",d.torrefacao);set("fProc",d.processo);set("fVar",d.variedade);set("fOri",d.origem);set("fNot",d.notas);if(/^\d{4}-\d{2}-\d{2}$/.test(d.data||""))set("fData",d.data);
  if(d.torra){const b=v.querySelector(`[data-un="torra"] [data-v="${d.torra}"]`);if(b){v.querySelectorAll('[data-un="torra"] [data-v]').forEach(c=>c.setAttribute("aria-pressed",String(c===b)));n++}}return n}
const erroTxt=e=>({not_granted:"Você não permitiu o uso do Claude nesta página.",rate_limited:"Muitas leituras seguidas. Espere um pouco e tente de novo.",images_unavailable:"Esta visualização não pode enviar fotos ao Claude."}[e&&e.code]||"Não consegui ler agora. Preencha à mão ou tente outra foto.");
async function reduz(f){try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||f),"image/jpeg",.85))}catch(e){return f}}
async function leFoto(v,f){const st=v.querySelector("#fFotoSt"),pv=v.querySelector("#fFotoPrev");try{pv.src=URL.createObjectURL(f);pv.hidden=false}catch(e){}
  if(!SAMPLE){st.textContent="A leitura pela foto funciona quando a página é aberta no Claude. Aqui, preencha à mão.";return}
  st.textContent="Lendo o rótulo com o Claude...";
  try{const img=await reduz(f);const d=await SAMPLE.json(`Esta é a foto da embalagem de um café especial. Leia o rótulo inteiro (frente e verso, se aparecerem) e extraia a ficha do café.\n${FICHA}`,{images:[img]});
    const n=preenche(v,d);st.textContent=n?`Preenchi ${n} campo${n===1?"":"s"} pela foto. Confira e toque em Salvar.`:"Não encontrei os dados no rótulo. Tente outra foto, mais perto e com luz."}
  catch(e){st.textContent=erroTxt(e)}}
async function buscaCafe(v){const q=v.querySelector("#fBusca").value.trim(),r=v.querySelector("#fBuscaRes");if(!q)return;v.querySelector("#fN").value=q;
  if(!SAMPLE){r.textContent="A busca funciona quando a página é aberta no Claude. Aqui, preencha à mão.";return}
  r.textContent="Procurando a ficha com o Claude...";
  try{const d=await SAMPLE.json(`O usuário quer cadastrar este café especial: "${q}". Preencha a ficha só com o que você sabe com segurança sobre este café ou sobre a linha desta torrefação; o que não souber deixe "". Mantenha "nome" como o usuário escreveu, corrigindo só a grafia.\n${FICHA}`,{modelTier:"default"});
    const n=preenche(v,d);r.textContent=n>1?`Preenchi ${n} campos com o que o Claude conhece. Confira, porque ele pode não conhecer este lote.`:"Não achei dados deste café. Preencha à mão ou use a foto."}
  catch(e){r.textContent=erroTxt(e)}}

// ===== eventos =====
document.addEventListener("click",e=>{const t=e.target;let b;if(t.closest(".veil"))return;
  if(b=t.closest("[data-nav]")){abre(b.dataset.nav);return}
  if(t.closest("#voltar")){pilha.pop();mostra();return}
  if(b=t.closest("#hLocs [data-loc]")){locAtual=locAtual===b.dataset.loc?"":b.dataset.loc;home();return}
  if(t.closest("#hGo")){toast(locAtual?`Abrindo o preparo: ${locN(locAtual)}`:"Escolha onde você está, ou siga sem local");return}
  if(b=t.closest("[data-ed]")){const[k,i]=b.dataset.ed.split("|");folha(k,+i);return}
  if(b=t.closest("[data-novo]")){folha(b.dataset.novo,null,b.dataset.modo);return}
  if(b=t.closest("[data-delrec]")){D.minhasReceitas.splice(+b.dataset.delrec,1);salva();mostra();return}
  if(b=t.closest("[data-tema]")){D.prefs.tema=b.dataset.tema;tema();salva();mostra();return}
  if(t.closest("#zero")){if(!t.closest("#zero").dataset.arm){t.closest("#zero").dataset.arm="1";t.closest("#zero").textContent="Confirmar: apagar tudo";return}D=JSON.parse(JSON.stringify(VAZIO));locAtual="";salva();mostra();toast("App como novo");return}
  if(t.closest("#exemplo")){D=JSON.parse(JSON.stringify(EXEMPLO));locAtual="";salva();mostra();toast("Exemplo carregado");return}
  if(t.closest("#mail")){const em=D.perfil.email.trim();if(!/.+@.+\..+/.test(em)){toast("Preencha o seu e-mail primeiro");$("pEm").focus();return}
    const corpo=D.minhasReceitas.length?D.minhasReceitas.map((r,i)=>`${i+1}. ${r.n}\n   Método: ${r.met}\n   Café: ${r.cafe}\n   Dose: ${r.dose}\n   Moedor: ${r.moedor}`).join("\n\n"):"Nenhuma receita salva ainda.";
    location.href=`mailto:${encodeURIComponent(em)}?subject=${encodeURIComponent("Minhas receitas de café")}&body=${encodeURIComponent(`Olá, ${D.perfil.nome||""}!\n\nSuas receitas da Calculadora de Café:\n\n${corpo}\n`)}`;return}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.pf){D.perfil[t.dataset.pf]=t.value;salva()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.pr){D.prefs[t.dataset.pr]=t.checked;salva()}});
function tema(){const r=document.documentElement;if(D.prefs.tema==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",D.prefs.tema)}
tema();home();
</script>
</body>
</html>
